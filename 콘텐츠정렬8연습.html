<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="reset.css" rel="stylesheet">
  <style>
    section{
      width: 1080px;
      display: flex;
      align-items: center;
    }
    form>.container{
      width: 520px;
      height: 520px;
      margin-bottom: 10px;
    }
    form{
      position: relative;
    }
    form>ul{
      position: absolute;
      width: 80px;
      height: 80px;
      display: flex;
      gap: 20px;
      align-items: center;
      left: 10px;
      
    }
    section>.txt{
      height: 100%;
      width: 1080px;
      margin-left: 20px;
      position: relative;
      outline: 1px solid red;
    }
    .txt>h1{
      font-size: 36px;
      padding-bottom: 160px;
      position: absolute;
      bottom: 150px;
    }
    .txt>p{
      position: absolute;
      bottom: 270px;
    }
    button{
      padding: 10px 40px;
      border: 1px solid #999;
      border-radius: 100px;
    }
    .txt>#size, .txt>#qty{
      border: none;
      padding: 10px 70px 10px 10px;
      background-color: #999;
      color: #666;
      margin-bottom: 15px;
    }
    .txt>#size{
      margin-right: 20px;
    }
    .content1>h2{
      font-size: 14px;
      border-top: 2px solid #999;
      color: #999;
      display: flex;
      gap: 1;
    }
  </style>
</head>
<body>
  <section>
    <form>
      <div class="container">
        <img src="http://picsum.photos/520">
      </div>
      <ul class="box">
        <li><img src="http://picsum.photos/80"></li>
        <li><img src="http://picsum.photos/80"></li>
        <li><img src="http://picsum.photos/80"></li>
        <li><img src="http://picsum.photos/80"></li>
        <li><img src="http://picsum.photos/80"></li>
      </ul>
    </form>
    <div class="txt">
      <h1>Division</h1>
      <p>10,000$</p>
      <select id="size" name="size">
        <option>SIZE</option>
      </select>
      <select id="qty" name="qty">
        <option>QTY</option>
      </select>
      <div class="content1">
        <h2> - DESCRIPTION</h2>
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Soluta sit veritatis nobis rem pariatur quae?</p>

        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Soluta sit veritatis nobis rem pariatur quae?</p>
      </div>
      <div class="content2">
        <h> + DESCRIPTION</h>
      </div>
      <button>BUTTON</button>
      <button>BUTTON</button>
    </div>
  </section>
</body>
</html>
