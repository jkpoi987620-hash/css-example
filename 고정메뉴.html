<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0; padding: 0;
      box-sizing: border-box;
    }
    ul,li{list-style: none;}
    a{text-decoration: none; color: inherit;}
    header, section, footer{
      width: 1000px;
      height: 900px;
      margin: auto;
    }
    header{background-color: yellow;}
    section{background-color: lightgreen;}
    footer{background-color: skyblue;}

    /*고정메뉴*/
    .fixed_menu{
      position: fixed;/*위치 고정*/
      width: 80px;
      background-color: #fff;
      text-align: center;
      font-size: 14px;
      top: 100px;
      left: 50%;/*전체 영역에 절반값을 이동 후 고정*/
      /*가운데를 기준으로 콘텐츠 넓이의 절반값만큼 오른쪽으로 이동시켜 브라우저의 넓이가 변경되더라도 항상 같은 위치에 있도록 설정*/
      margin-left: 500px;/*그리고 그 콘텐츠 값의 절반 값 만큼 이동 하면 원하는 곳 고정*/
    }
    .fixed_menu>.title{
      width: 100%;
      height: 80px;
      padding: 20px;
      background-color: tomato;
      color: #fff;
      font-weight: bold;
    }
    .btn>li>a{
      display: block;
      width: 100%;
      height: 80px;
      padding: 30px 0;
      color: #333;
      border-bottom:1px solid #999;
    }
    /*마지막 메뉴 요소의 자식인 a요소*/
    .btn>li:last-child>a{
      border-bottom: 0;/*밑줄 제거*/
    }
    .btn>li>a:hover{
      color: tomato;
    }
    .top_btn{
      width: 100%;
      height: 60px;
      background-color: tomato;
      color: #fff;
      padding: 20px 0;
      font-weight: bold;
      cursor: pointer;/*커서 모양을 포인터로 변경*/
    }
  </style>
</head>
<body>
  <!--고정메뉴-->
  <div class="fixed_menu">
    <div class="title">
      Quick<br>
      MENU
    </div>
    <ul class="btn">
      <li><a href="#">MENU</a></li>
      <li><a href="#">MENU</a></li>
      <li><a href="#">MENU</a></li>
      <li><a href="#">MENU</a></li>
    </ul>
    <div class="top_btn">TOP</div>
  </div>
  <header></header>
  <section></section>
  <footer></footer>
</body>
</html>
