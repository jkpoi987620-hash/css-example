<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{margin: 0; padding: 0; box-sizing: border-box;}
    a{
      text-decoration: none; color: inherit;
    }
    body{
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      color: #666;
      font-size: 14px;
    }
    .login{
      display: none;/*화면에서 제거*/
      position: fixed;/*공중에 띄우기*/
      inset: 0;/*브라우저와 같은 크기로 설정 탑,바텀,레프트.라이트 0 으로 설정이랑 같음*/
      background-color: rgba(0, 0, 0, 0.8);
    }
    .login>.container{
      width: 500px;
      background-color: #fff;
      margin: 100px auto;/*좌우 가운데 정렬*/
      border-radius: 10px;
    }
    .login h1{
      text-align: center;
      padding-top: 40px;
    }
    .login form{
      width: 100%;
      padding: 40px;
    }
    input[type=text], input[type=password]{
      width: 100%;
      border: 1px solid #999;
      padding: 16px;
      margin-bottom: 10px;
    }
    .login form p{
      line-height: 40px;
    }
    input[type=checkbox]{
      vertical-align: middle;
      transform: translateY(-1px);/*위로 1픽셀 이동하여 정렬*/
    }
    .login .join{
      width: 100%;
      border-top: 1px solid #ccc;
      padding: 20px 0;
      text-align: center;
    }
    input[type=submit]{/*인풋 태그 지정할때는 이런식으로*/
      float: right;
      height: 40px;
      padding: 6px 16px;
      font-weight: bold;
      color: #fff;
      background-color: #696;
      border: none;/*외곽선 제거*/
      outline: none;/*외곽선 제거*/
      cursor: pointer;/*커서 모양 변경 손가락 모양으로*/
    }
    .join>a{padding: 0 20px;}/*좌우 여백 줘서 떨구기*/
    .join>a:first-child{
      border-right: 1px solid #ccc;/*그 사이에 선 만들기*/
    }
  </style>
</head>
<body>
  <div class="login">
    <div class="container">
      <h1>LOGIN</h1>
      <form>
        <input type="text" name="id" placeholder="아이디" required>
        <input type="password" name="password" placeholder="비밀번호" required>
        <!--리퀴리드 : 필수 입력창(입력 안하면 경고 창 뜸)-->
        <p>
          <input type="checkbox"> 로그인 유지
          <input type="submit" value="로그인">
        </p>
      </form>
      <div class="join">
        <a href="#">아이디/비밀번호 찾기</a>
        <a href="#">회원가입</a>
      </div>
    </div>
  </div>

  <section id="bg">
    <h1>로그인 입력창을 만들어 봅시다</h1>
    <!--버튼 요소를 클릭하면 loginOpen 함수를 호출-->
    <!--함수 이름또한 내가 정한다-->
    <button type="button" onclick="loginOpen()">로그인</button><!--버튼창 누를수있는 로그인창 만들기-->
  </section>
  <!--자바스크립트 코드-->
  <script>
    /*
      1. loginOpen함수를 생성
      2. 클래스가 로그인인 요소를 선택
      3. 로그인 요소의 디스플레이 속성을 블록으로 변경
    */
    function loginOpen(){//로그인 오픈 함수 생성 자바는 한줄 주석 가능
      //실행코드
      //클래스가 로그인인 요소를 선택, css속성인 디스플레이를 블록으로 변경
      document.querySelector(".login").style.display="block";
    }
  </script>
</body>
</html>
