<!DOCTYPE html>
<html lang="en">
<head>

  <title>Document</title>

  <!--노말라이즈-->
  <link href="reset.css" rel="stylesheet">
  <style>
    nav{
      width: 1200px;
      padding: 0 30px;
      margin: auto;
      display: flex;
      justify-content: space-between;/*주축정렬 (양쪽 끝으로)*/

    nav .logo{
      font-size: 100px;
      line-height: 1;/*위아래 여백 축소 가능*/

    nav ul{

    }
    nav a:hover{
      color: tomato;
    }

</head>

  <nav>
