    .overlay{
      position: absolute;

      background-color: rgba(0, 0, 0, 0.5);
      display: none;/*화면에서 제거*/
    }
    .overlay>.text{
      color: #fff;
      font-size: 60px;
      margin: 0;
      text-align: center;
      position: absolute;
      width: 100%;
      /*pos:abs를 적용시 가운데 정렬방법*/
      top: 50%;
      margin-top: -35px;
    }

    /*container에 마우스를 올리면 overlay요소가 화면에 나타남*/
    .container:hover>.overlay{
      display: block;
    }
  </style>
