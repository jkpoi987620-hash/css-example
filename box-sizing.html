<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /*공통속성*/
    div{
      width: 200px;
      margin: 20px;
      padding: 20px;
      border: 20px solid black;
      color: #fff;
      font-size: 20px;
    }

    .content-box{
      background-color: orange;
      box-sizing: content-box;/*기본값*/
      .border-box{
        box-sizing: border-box;/*width와 height속성이 padding과 bordrt를 포함한다*/
      }
    }

    .container{
      width: 300px;
      border: 1px solid red;
      background-color: #ababab;
    }
    .box1{
      width: 100%;
      background-color: skyblue;/*ctrl+/=꾸기*/
      border: 10px solid black;
      box-sizing: content-box;
    }
    .box2
    /*기본값*/
      /*요소가 넓이가 100%(요소가 차지할 수 있는 최대 넓이)
      에서 테두리 10px만큼 추가되어 부모요소 보다 커짐->결과적으로 레이아윳이 무너집니다
      
  </style>
</head>
<body>
  <div class="content-box">content-box</div>
  <div class="border-box">border-box</div>

  <section class="container">
    <article class="box1">Box 1</article>
    <article class="box2">Box 2</article>
  </section>
  
</body>
</html>
