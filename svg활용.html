<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>svg활용</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@100..900&display=swap');

    article {
      width: 500px;
      border: 1px solid #000;
      box-sizing: border-box;
      padding: 50px;
      margin: auto;
    }

    article svg {
      width: 100%;
    }

    /*부모인 500px에 맞춰 꽉 차게*/

    /*path속성 바꾸기*/
    article svg path {
      fill: transparent;
      /*면색*/
      stroke: red;
      /*선색*/
      stroke-width: 10;
      /*선의 두께*/
      stroke-dasharray: 1600;
      /*path길이 만큼 점선 만들어짐*/
      stroke-dashoffset: -1600;
      /*점선의 시작점 위치 변경*/
      transition: all 3s;
      /*변환 효과*/
    }

    article:hover svg path {
      stroke-dashoffset: 0;
    }
    section svg text{
      stroke-dasharray: 260;
      stroke-dashoffset: -260;
      transition: all 3s;
    }
    section:hover svg text{
      stroke-dashoffset: 0;
    }   
  </style>
</head>
