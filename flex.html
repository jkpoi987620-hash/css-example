<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex속성</title>
  <style>
    *{margin: 0; padding: 0;}
    main{
      width: 100%;
      height: 100vh;
      background-color: lightcyan;
    }
    section{
      height: 100%;
      border: 10px solid blue;
      display: flex;/*섹션 요소는 블록과 같아집니다(블록으로 바뀜)*/
      /*display: inline-flex;*//*섹션 요소가 인라인과 같아집니다(인라인으로 바뀜)*/
      /*크기가 자동으로 조정 위드 하이트에 맞춰서.*/
      flex-wrap: wrap;/*줄바꿈 허용, nowrap 허용x*/
      /*주축 정렬*/
      justify-content: flex-start;
      /*왼쪽 정렬*/
      justify-content: flex-end;
      /*오른쪽정렬*/
      justify-content: center;
      /*가운데 정렬*/
      justify-content: space-between;
      /*요소 양끝부터 나눠서 정렬*/
      justify-content: space-around;
      /*요소의 여백을 균일하게 나눠서 정렬*/
      justify-content: space-evenly;
      /*끝에 여백까지 균일하게 정렬*/

      /*교차축 정렬(두줄 이상일때만 사용)*/
      align-content: flex-start;/*위*/
      align-content: flex-end;/*아래*/
      align-content: center;/*가운데*/
      align-content: space-between;/*위 아래 나눠서 정렬*/
    }
    section article{
      width: 100px;
      height: 100px;
      background-color: aqua;
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <article></article>
      <article></article>
      <article></article>
      <article></article>
      <article></article>
      <article></article>
      <article></article>
    </section>
    <section>
      <article></article>
      <article></article>
      <article></article>
      <article></article>
      <article></article>
    </section>
  </main>
</body>
</html>
