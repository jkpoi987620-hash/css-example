<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{margin: 0; padding: 0;}
    a{text-decoration: none; color: inherit;}
    #notice{
      width: 1200px;
      margin: auto;
      padding: 0 10px;
      box-sizing: border-box;
    }
    #notice>h1{
      font-size: 36px;
      margin-bottom: 40px;
    }
    table{
      width: 100%;/*테이블 태그는 위드 값을 꼭 지정해 줘야함*/
      border-collapse: collapse;/*테이블 태그 안쪽 셀 사이 여백을 제거(이걸로 제거 가능)필수*/
    }
    th{/*th태그는 텍스트 얼라인 센터로 자동 정렬 되어있음*/
      border-top: 2px solid #000;/*윗줄 넣기*/
      border-bottom: 1px solid #000;/*밑줄넣기*/
      font-size: 16px;
      height: 60px;/*테이블 태그는 하이트 주면 알아서 정렬가능*/
    }
    td{
      border-bottom: 1px dotted #999;/*점선*/
      font-size: 14px;
      position: relative;/*부모요소한테 주기*/
    }
    td:first-child{
      /*상 우 하 좌 (시계방향으로 들어감)*/
      padding: 20px 0 20px 44px;
    }
    /*동그라미 만들기(dot)*/
    td:first-child::after{/*가상요소 설정*/
      content: "";
      position: absolute;/*객체 띄우기*/
      width: 4px; height: 4px;
      background-color: #000;
      border-radius: 50%;
      left: 20px;
      top: 50%; margin-top: -2px;
    }
    td:last-child{text-align: center;}
    .pagination{
      width: 100%;
      margin-top: 20px;
      text-align: center;/*부모 최상위 요소한테 주기*/
    }
    .pagination-wrap{
      display: inline-block;/*블록 요소기 떄문에 가운데 정렬을 시키기 위해 인라인 요소로 바꿔줌 블록이면 센터 기능이 안들어감*/
    }
    .pagination a{
      float: left;/*속성이 자동으로 블록으로 변한다 (포지션도 마찬가지)*/
      /*인라인 요소에 플롯 속성을 주면 블록으로 바뀜*/
      padding: 8px 16px;
      transition: 0.3s;/*변환 효과 (애니메이션)*/
    }
    /*활성화 효과*/
    .pagination .active{/*클래스 액티브만 효과 활성화*/
      background-color: #4caf50;
      color: white;
    }
    .pagination a:hover:not(.active){/*호버 효과*//*낫 효과 : 클래스 액티브에 호버효과 제외*/
      background-color: #ddd;
    }
  </style>
</head>
<body>
  <section id="notice">
    <h1>공지사항</h1>
    <table>
      <tr>
        <th>제목</th>
        <th>등록일</th>
      </tr>
      <tr>
        <td>서비스 종료에 따른 구매 이용약관 개정 안내</td>
        <td>25/12/27</td>
      </tr>
      <tr>
        <td>서비스 종료 안내</td>
        <td>25/12/26</td>
      </tr>
      <tr>
        <td>이용약관 개정 안내</td>
        <td>25/12/25</td>
      </tr>
      <tr>
        <td>[당첨자 발표] 뉴진스 팬사인회</td>
        <td>25/12/24</td>
      </tr>
      <tr>
        <td>[당첨자 발표] BTS 팬사인회 당첨자 안내드립니다</td>
        <td>25/12/24</td>
      </tr>
    </table>
    <div class="pagination"><!--페이지 추가 하기 옵션 만들기-->
      <div class="pagination-wrap">
        <a href="#">&laquo;</a><!--앞으로 가기-->
        <a class="active" href="#">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">4</a>
        <a href="#">5</a>
        <a href="#">6</a>
        <a href="#">&raquo;</a><!--뒤로 가기-->
      </div>
    </div>
  </section>
</body>
</html>
