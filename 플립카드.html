<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>플립카드</title>
  <style>
    .flip-card{
      background-color: transparent;
      width: 300px; height: 300px;
      border: 1px solid #f1f1f1;
      perspective: 1000px;/*원금감 설정(깊이감을 1000px로 설정)*/
    }
    /*이 요소는 앞면과 뒷면을 배치하는데 필요*/
    .flip-card-inner{
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transform-style: preserve-3d;
      /*트랜스폼 스타일 속성은 요소의 자식요소가 입체적인 3d 공간에 배치될지, 요소의 표면에 평평하게 묘사할지를 결정합니다.
      기본값은 플랫으로 자식요사2d의 2차원에서 부모요소와 동일한 평면에 배치되고 프리설브-3d지정하면 3d공간에 배치됩니다*/
      transition: transform 0.8s;/*변환효과*/
    }

    .flip-card-front, .flip-card-back{/*앞면과 뒷면 모두 선택*/
      position: absolute;
      width: 100%; height: 100%;
      backface-visibility: hidden;/*요소의 뒷면을 투명하게 설정*/ 
    }
    /*뒷면 스타일*/
    .flip-card-back{
      background-color: dodgerblue;
      color: white;
      transform: rotateY(180deg);/*요소를 y축으로 180도 회전하여 가려놓는다*/
    }
    /*플립상자 컨테이너 위로 마우스를 이동할때 수평 뒤집기 수행*/
    .flip-card:hover .flip-card-inner{
      transform: rotateY(180deg);/*카드 뒤집었을때 글씨가 나오는 애니메이션 효과*/
    }
  </style>
</head>
<body>
  <div class="flip-card">
    <div class="flip-card-inner">
      <div class="flip-card-front">
        <img src="images/user.jpg" alt="user" width="300" height="300"><!--이미지 태그에는 크기 조정 가능-->
      </div>
      <div class="flip-card-back">
        <h1>John Doe</h1>
        <p>Architect &amp; Engineer</p>
        <p>We love that guy</p>
      </div>
    </div>
  </div>
</body>
</html>
