<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="reset.css" rel="stylesheet">
  <style>
    .container{
      width: 100%;
      height: 100vh;
    }
    .container>.bg-img{
      width: 100%;
      height: 920px;
      background-image: url(images/image1.jpg);
      background-position: center;
      background-size: cover;
      position: relative;
    }
    .bg-img>.txt{
      width: 560px;
      height: 220px;
      text-align: center;
      background-color: rgba(144, 152, 155, 0.5);
      border-radius: 30px;
      position: absolute;
      top: 40%; left: 40%;
    }
    .txt>h1{
      font-size: 72px;
      line-height: 120px;
    }
    .txt>p{
      font-size: 24px;
      line-height: 40px;
    }
    .img-menu{
      display: flex;
      width: 905px;
      height: 170px;
      position: absolute;
      
      outline: 1px solid red;
      border: 5px solid #000;
      left: 30%;
      bottom: 10px;
      

    }
    .img1{
      width: 220px;
      height: 160px;
      background-image: url(images/image1.jpg);
      background-position: center;
      background-size: cover;
    }
    .img2{
      width: 220px;
      height: 160px;
      background-image: url(images/image2.jpg);
      background-position: center;
      background-size: cover;
      
    }
    .img3{
      width: 220px;
      height: 160px;
      background-image: url(images/image3.jpg);
      background-position: center;
      background-size: cover;
    }
    .img4{
      width: 220px;
      height: 160px;
      background-image: url(images/image4.jpg);
      background-position: center;
      background-size: cover;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="bg-img">
      <div class="txt">
        <h1>LOGO HERE</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.
          Qui, recusandae.</p>
      </div>
    </div>
    <div class="img-menu">
      <div class="img1"></div>
      <div class="img2"></div>
      <div class="img3"></div>
      <div class="img4"></div>
    </div>
  </div>
</body>
</html>
