<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="reset.css" rel="stylesheet">
  <style>
    .container{
      width: 100%;
      height: 100vh;
      position: relative;
      display: flex;
    }
    .bg-img{
      width: 500px;
      height: 520px;
      background: url(images/color1.png) center/cover;
    }
    .bg-img>.bg-txt{
      width: 500px;
      height: 120px;
      background-color: rgba(0, 0, 0, 0.5);
      color: #fff;
      text-align: center;
      position: absolute;
      top: 39%;
    }
    .evt{
      width: 500px;
      height: 160px;
      display: flex;
      background-color: gold;
      font-size: 20px;
    }
    .evt>p{
      padding: 20px 180px 20px 20px;
    }
  </style>
</head>
<body>
  <section class="container">
    <div class="box">
      <div class="bg-img">
        <div class="bg-txt">
          <h1>Lorem Ipsum</h1>
        </div>
      </div>
      <div class="evt">
        <p><b>디자인하우스</b>에서<br>더 많은 인사이트를<br>발견하세요!</p>
        <img src="images/banner1.png" alt>
      </div>
    </div>
    <div class="menu">
      <div class="top-img">
        <div class="bg1">
          <p>Lorem Ipsum</p>
        </div>
        <div class="bg2">
          <p>Lorem Ipsum</p>
        </div>
        <div class="bg3">
          <p>Lorem Ipsum</p>
        </div>
        <div class="bg4">
          <p>Lorem Ipsum</p>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
