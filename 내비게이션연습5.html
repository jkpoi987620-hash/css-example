<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://kit.fontawesome.com/632d3e2496.js" crossorigin="anonymous"></script>
  <link href="reset.css" rel="stylesheet">
  <style>
    nav>.box{
      margin: auto;
      width: 100%;
      color: #fff;
      background-color: #f60;
      min-width: 1200px;
      height: 120px;
      padding: 0 30px 0 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .box>ul{
      font-size: 14px;
      display: flex;
      gap:60px;
      font-weight: bold;
    }
    .left-lg>a{
      font-size: 22px;
    }
  </style>
</head>
<body>
  <nav>
    <div class="box">
      <h1 class="right-lg">
        <a href="#"><i class="fas fa-volleyball-ball"></i>
        </a>
      </h1>
      <ul>
        <li>ABOUT</li>
        <li>NEWS</li>
        <li>PORTFOLIO</li>
        <li>BOARD</li>
        <li>ALBUM</li>
        <li>CONTACT</li>
      </ul>
      <div class="left-lg">
        <a href="#"><i class="fas fa-search"></i></a>
      </div>
    </div>
  </nav>
</body>
</html>
