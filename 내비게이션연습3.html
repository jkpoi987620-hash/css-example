<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="reset.css" rel="stylesheet">
  <style>
    nav{
      width: 100%;
      min-width: 1200px;
      background-color: #333;
      color: #fff;
    }
    nav>.container1{
      height: 40px;
      margin: auto;
      padding: 0 40px;
      display: flex;
      justify-content: space-between;
      flex-direction: row-reverse;
      align-items: center;/*교차축 정렬*/
    }
    nav>.container2{
      background-color: #f60;
      height: 80px;
      padding: 0 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .gnb1{
      display: flex;
      gap: 40px;
      font-family: "맑은고딕";
    }
    .gnb2{
      display: flex;
      gap: 45px;
      font-family: "맑은고딕";
    }
    .gnb1>li:hover{
      color: turquoise;
    }
    .gnb2>li:hover{
      color: aqua;
    }
    .gnb1>li{font-size: 18px;}
    .gnb2>li{font-size: 20px;}
  </style>
</head>
<body>
  <nav>
    <div class="container1">
      <ul class="gnb1">
        <li><a href="#">login</a></li>
        <li><a href="#">join us</a></li>
        <li><a href="#">member</a></li>
      </ul>
    </div>
    <div class="container2">
      <h1 class="logo">
        <a href="#">SHAMMAH</a>
      </h1>
      <ul class="gnb2">
        <li><a href="#">ABOUT</a></li>
        <li><a href="#">NEWS</a></li>
        <li><a href="#">PORTFOLIO</a></li>
        <li><a href="#">BOARD</a></li>
        <li><a href="#">ALBUM</a></li>
        <li><a href="#">CONTACT</a></li>
      </ul>
    </div>
  </nav>
</body>
</html>
